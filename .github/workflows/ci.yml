name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests with coverage
        run: |
          mkdir -p work
          uv run --locked --extra dev --extra sites pytest --basetemp=work/pytest
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Format check
        run: uv run --extra dev ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sites Worker contract and build
        working-directory: sites
        run: |
          npm test
          npm run build
          npm run validate
